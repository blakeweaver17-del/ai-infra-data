name: weekly-financials
on:
  schedule:
    - cron: "0 12 * * 6"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: data-commit
jobs:
  financials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_financials.py
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "financials $(date -u +%F)"
          git pull --rebase && git push
