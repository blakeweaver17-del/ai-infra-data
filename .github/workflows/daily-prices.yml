name: daily-prices
on:
  schedule:
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: data-commit
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_prices.py
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "prices $(date -u +%F)"
          git pull --rebase && git push
